# TridePlayer — a minimal iOS host for Tride scenes (TrideKit snapshot example).
# The .xcodeproj next to this file is generated from it (`xcodegen generate`); open that one.
name: TridePlayer
options:
  bundleIdPrefix: com.example.tride
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    # Filament's simulator libraries are arm64 only (Apple-silicon Macs).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    TARGETED_DEVICE_FAMILY: "1"

packages:
  TrideKit:
    path: "../.."

targets:
  TridePlayer:
    type: application
    platform: iOS
    sources:
      - TridePlayer
    dependencies:
      - package: TrideKit
        product: TrideKit
      - package: TrideKit
        product: TrideCore
    # A .trd added to the app's resources ships its materials as precompiled Metal libraries: no
    # shader compiling on an iPhone's first run.
    buildToolPlugins:
      - plugin: TrideMaterials
        package: TrideKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tride.player
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Tride Player
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
